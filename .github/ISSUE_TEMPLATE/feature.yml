name: Feature request / پیشنهاد قابلیت
description: Suggest a change to the Video Converter workflow.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to do?
      description: Describe the workflow or limitation. You can write in Persian or English.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What change would help?
    validations:
      required: true
